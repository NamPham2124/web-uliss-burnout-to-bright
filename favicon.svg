<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Outer Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Inner Core Flame Gradient -->
    <linearGradient id="innerFlameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#glowGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-opacity="0.3" />

  <!-- Main Radiant Flame -->
  <g filter="url(#softShadow)">
    <!-- Outer Flame: Symmetrical & Organic Fire-Flame Curve -->
    <path d="M256 96 
             C275 160 330 200 350 255 
             C375 320 345 385 285 410 
             C240 430 190 415 165 375 
             C135 325 155 265 190 230 
             C205 215 210 195 200 175 
             C225 185 245 205 250 235 
             C255 195 245 140 256 96 Z" 
          fill="url(#flameGrad)" />

    <!-- Inner Core Bright Flame -->
    <path d="M256 210 
             C270 250 300 280 305 320 
             C310 355 285 390 256 395 
             C225 390 205 355 215 320 
             C222 290 242 265 250 240 
             C253 230 255 220 256 210 Z" 
          fill="url(#innerFlameGrad)" opacity="0.92" />
  </g>

  <!-- Sparkle Star (Burn Bright) at top right -->
  <path d="M360 115 Q360 145 390 145 Q360 145 360 175 Q360 145 330 145 Q360 145 360 115 Z" fill="#ffffff" opacity="0.95" />
  <!-- Small secondary sparkle -->
  <circle cx="395" cy="185" r="7" fill="#fef08a" opacity="0.8" />
  <!-- Small sprout/leaf accent dot at bottom left -->
  <circle cx="155" cy="165" r="5" fill="#a7f3d0" opacity="0.75" />
</svg>
